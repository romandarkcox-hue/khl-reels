# Вечерний пост «Итоги дня»: счета матчей и таблицы «Запад» и «Восток» → Telegram-канал.
# Каждые 20 минут с 20:30 до 01:10 МСК быстро проверяет календарь khl.ru.
# Когда все матчи дня закончились, публикует пост и коммитит снимок таблицы
# data/history/ГГГГ-ММ-ДД.json. Пост за день выходит один раз:
# метка data/posted/ГГГГ-ММ-ДД-evening.
# Запускают два будильника: расписание GitHub и cron-job.org (GitHub иногда пропускает запуски).

name: Итоги дня

on:
  schedule:
    # Время в UTC (МСК минус 3 часа): 17:30 … 22:10 UTC = 20:30 … 01:10 МСК.
    - cron: "30,50 17 * * *"
    - cron: "10,30,50 18-21 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Игровой день ГГГГ-ММ-ДД (пусто = сегодня)"
        required: false
      partial:
        description: "Опубликовать, даже если не все матчи закончились"
        type: boolean
        default: false
      force:
        description: "Опубликовать заново, даже если пост за этот день уже был"
        type: boolean
        default: false

concurrency:
  group: evening-review
  cancel-in-progress: false

permissions:
  contents: write # чтобы закоммитить снимок таблицы и метку

jobs:
  evening:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          ref: main # свежий main, чтобы увидеть метку, поставленную соседним запуском

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Какой игровой день
        id: day
        env:
          INPUT_DAY: ${{ inputs.day }}
        run: |
          # После полуночи ещё идёт вчерашний игровой день, поэтому «минус 5 часов».
          DAY="${INPUT_DAY:-$(TZ=Europe/Moscow date -d '-5 hours' +%F)}"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Игровой день: $DAY"
          if [ -f "data/posted/$DAY-evening" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
          # После 01:00 МСК (22:00 UTC) — последний шанс за ночь: публикуем,
          # даже если какой-то матч завис (например, перенесён).
          if [ "$(date -u +%H)" -ge 22 ] || [ "$(date -u +%H)" -lt 3 ]; then
            echo "last=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Пост за этот день уже опубликован
        if: steps.day.outputs.done == 'true' && !inputs.force
        run: echo "Метка data/posted/${{ steps.day.outputs.day }}-evening есть, ничего не делаю."

      - name: Проверить матчи дня
        id: status
        if: steps.day.outputs.done != 'true' || inputs.force
        run: node scripts/review-status.mjs "${{ steps.day.outputs.day }}"

      - name: Решить, публиковать ли пост
        id: go
        if: steps.status.outcome == 'success'
        env:
          TOTAL: ${{ steps.status.outputs.total }}
          FINISHED: ${{ steps.status.outputs.finished }}
          LAST: ${{ steps.day.outputs.last }}
          PARTIAL_INPUT: ${{ inputs.partial }}
        run: |
          if [ "$FINISHED" -eq 0 ]; then
            echo "Завершённых матчей нет, жду следующей проверки."
          elif [ "$FINISHED" -eq "$TOTAL" ]; then
            echo "Все матчи закончились, публикую пост."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" = "true" ] || [ "$PARTIAL_INPUT" = "true" ]; then
            echo "Не все матчи закончились, но это последняя проверка — публикую то, что есть."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "flags=--partial" >> "$GITHUB_OUTPUT"
          else
            echo "Закончилось $FINISHED из $TOTAL, жду следующей проверки."
          fi

      - name: Установить зависимости
        if: steps.go.outputs.build == 'true'
        run: |
          npm ci
          npm ci --prefix video

      - name: Пост в канал
        if: steps.go.outputs.build == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/make-evening.mjs "${{ steps.day.outputs.day }}" ${{ steps.go.outputs.flags }}

      - name: Закоммитить снимок таблицы и метку «пост опубликован»
        if: steps.go.outputs.build == 'true'
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          mkdir -p data/posted
          date -u +%FT%TZ > "data/posted/$DAY-evening"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted data/history
          git commit -m "Итоги дня за $DAY"
          git pull --rebase
          git push

      - name: Сохранить картинки как файлы запуска
        if: steps.go.outputs.build == 'true' || failure()
        uses: actions/upload-artifact@v7
        with:
          name: evening
          path: video/out/
          if-no-files-found: ignore

      - name: Сообщить в Telegram о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Вечерний пост «Итоги дня» не опубликован. Подробности: ${RUN_URL}" > /dev/null
