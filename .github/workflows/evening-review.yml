# Вечерний Reels «Итоги игрового дня».
# Каждые 20 минут с 20:30 до 01:10 МСК быстро проверяет календарь khl.ru.
# Когда все матчи дня закончились, собирает ролик и шлёт его в Telegram.
# Ролик за день делается один раз: метка — файл data/reviews/ГГГГ-ММ-ДД.json.

name: Итоги дня

on:
  schedule:
    # Время в UTC (МСК минус 3 часа): 17:30 … 22:10 UTC = 20:30 … 01:10 МСК.
    - cron: "30,50 17 * * *"
    - cron: "10,30,50 18-21 * * *"
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Игровой день ГГГГ-ММ-ДД (пусто = сегодня)"
        required: false
      partial:
        description: "Собрать, даже если не все матчи закончились"
        type: boolean
        default: false
      force:
        description: "Собрать заново, даже если ролик за этот день уже был"
        type: boolean
        default: false

concurrency:
  group: evening-review
  cancel-in-progress: false

permissions:
  contents: write # чтобы закоммитить метку data/reviews/

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Забрать код
        uses: actions/checkout@v7

      - name: Установить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Какой игровой день
        id: day
        env:
          INPUT_DAY: ${{ inputs.day }}
        run: |
          # После полуночи ещё идёт вчерашний игровой день, поэтому «минус 5 часов».
          DAY="${INPUT_DAY:-$(TZ=Europe/Moscow date -d '-5 hours' +%F)}"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Игровой день: $DAY"
          if [ -f "data/reviews/$DAY.json" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
          # После 01:00 МСК (22:00 UTC) — последний шанс за ночь: собираем,
          # даже если какой-то матч завис (например, перенесён).
          if [ "$(date -u +%H)" -ge 22 ] || [ "$(date -u +%H)" -lt 3 ]; then
            echo "last=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ролик за этот день уже сделан
        if: steps.day.outputs.done == 'true' && !inputs.force
        run: echo "Метка data/reviews/${{ steps.day.outputs.day }}.json есть, ничего не делаю."

      - name: Проверить матчи дня
        id: status
        if: steps.day.outputs.done != 'true' || inputs.force
        run: node scripts/review-status.mjs "${{ steps.day.outputs.day }}"

      - name: Решить, собирать ли ролик
        id: go
        if: steps.status.outcome == 'success'
        env:
          TOTAL: ${{ steps.status.outputs.total }}
          FINISHED: ${{ steps.status.outputs.finished }}
          LAST: ${{ steps.day.outputs.last }}
          PARTIAL_INPUT: ${{ inputs.partial }}
        run: |
          if [ "$FINISHED" -eq 0 ]; then
            echo "Завершённых матчей нет, жду следующей проверки."
          elif [ "$FINISHED" -eq "$TOTAL" ]; then
            echo "Все матчи закончились, собираю ролик."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$LAST" = "true" ] || [ "$PARTIAL_INPUT" = "true" ]; then
            echo "Не все матчи закончились, но это последняя проверка — собираю с тем, что есть."
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "flags=--partial" >> "$GITHUB_OUTPUT"
          else
            echo "Закончилось $FINISHED из $TOTAL, жду следующей проверки."
          fi

      - name: Установить зависимости
        if: steps.go.outputs.build == 'true'
        run: |
          npm ci
          npm ci --prefix video

      - name: Скачать фоновый трек
        if: steps.go.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download assets -p track.mp3 -D video/public/music --clobber

      - name: Собрать ролик и отправить в Telegram
        if: steps.go.outputs.build == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_VOICE: ${{ secrets.YANDEX_VOICE }}
          YANDEX_ROLE: ${{ secrets.YANDEX_ROLE }}
          YANDEX_SPEED: ${{ secrets.YANDEX_SPEED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/make-review.mjs "${{ steps.day.outputs.day }}" ${{ steps.go.outputs.flags }}

      - name: Закоммитить метку «ролик готов»
        if: steps.go.outputs.build == 'true'
        env:
          DAY: ${{ steps.day.outputs.day }}
        run: |
          if [ ! -f video/out/review.mp4 ]; then
            echo "Видео не появилось, метку не ставлю."
            exit 0
          fi
          mkdir -p data/reviews
          cp video/public/review.json "data/reviews/$DAY.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews
          git commit -m "Итоги дня за $DAY"
          git pull --rebase
          git push

      - name: Сохранить ролик как файл запуска
        if: steps.go.outputs.build == 'true' || failure()
        uses: actions/upload-artifact@v7
        with:
          name: review
          path: video/out/
          if-no-files-found: ignore

      - name: Сообщить в Telegram о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Ролик «Итоги дня» не собрался. Подробности: ${RUN_URL}" > /dev/null
