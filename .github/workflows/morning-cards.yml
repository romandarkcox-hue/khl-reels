# Утренний анонс: в 7:00 по Москве картинка с матчами дня → Telegram-канал и группа ВК.
# Нет матчей — ничего не публикуется. Анонс за день выходит один раз:
# метка data/posted/ГГГГ-ММ-ДД-announce.
# Запускают два будильника: расписание GitHub и cron-job.org (GitHub иногда
# пропускает запуски или опаздывает).

name: Анонс 7:00

on:
  schedule:
    # 04:00 UTC = 7:00 МСК.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "День ГГГГ-ММ-ДД (пусто = сегодня)"
        required: false
      force:
        description: "Опубликовать заново, даже если анонс за этот день уже был"
        type: boolean
        default: false

# Не даём ручному запуску и запуску по расписанию идти одновременно.
concurrency:
  group: morning-announce
  cancel-in-progress: false

permissions:
  contents: write # чтобы закоммитить метку «анонс опубликован»

jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Забрать код
        uses: actions/checkout@v7
        with:
          ref: main # свежий main, чтобы увидеть метку, поставленную соседним запуском

      - name: Анонс сегодня уже опубликован?
        id: done
        env:
          INPUT_DAY: ${{ inputs.day }}
        run: |
          DAY="${INPUT_DAY:-$(TZ=Europe/Moscow date +%F)}"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          if [ -f "data/posted/$DAY-announce" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "Метка data/posted/$DAY-announce есть, ничего не делаю."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить Node.js
        if: steps.done.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json

      - name: Установить зависимости
        if: steps.done.outputs.skip != 'true'
        run: |
          npm ci
          npm ci --prefix video

      - name: Анонс в канал и ВК
        if: steps.done.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
        run: node scripts/make-announce.mjs "${{ steps.done.outputs.day }}"

      - name: Закоммитить метку «анонс опубликован»
        if: steps.done.outputs.skip != 'true'
        env:
          DAY: ${{ steps.done.outputs.day }}
        run: |
          mkdir -p data/posted
          date -u +%FT%TZ > "data/posted/$DAY-announce"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted
          git commit -m "Анонс за $DAY"
          git pull --rebase
          git push

      - name: Сохранить картинки как файлы запуска
        if: steps.done.outputs.skip != 'true' || failure()
        uses: actions/upload-artifact@v7
        with:
          name: announce
          path: video/out/
          if-no-files-found: ignore

      - name: Сообщить в Telegram о сбое
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Утренний анонс не опубликован. Подробности: ${RUN_URL}" > /dev/null
